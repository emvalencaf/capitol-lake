<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capitol Lake · Bronze to silver data flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #faf9f6; --paper-2: #f0efe9; --ink: #16191f; --muted: #545b64;
      --soft: #7d8998; --rule: rgba(22,25,31,0.12); --accent: #ff9900;
      --accent-tint: rgba(255,153,0,0.08); --link: #146eb4;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 728px; }
    .step-number, .step-label, .lane-label, .role-text, .chip-text, .legend-label { font-family: var(--mono); text-anchor: middle; }
    .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; }
    .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
    .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
    .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; }
    .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
    .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
    .chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
    .focal-text { fill: var(--accent); }
    .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
    .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Data flow · Capitol Lake</p>
    <h1>Bronze to silver, by pipeline stage</h1>

    <svg viewBox="0 0 840 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-flow-title data-flow-desc">
      <title id="data-flow-title">Capitol Lake bronze-to-silver data flow</title>
      <desc id="data-flow-desc">House and Senate each collect and extract their own filings into
        rows; both then pass through a shared ticker-resolution, LLM-fallback and quality-gate
        stage before a shared silver write serializes filings and transactions to partitioned
        Parquet.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(22,25,31,0.10)"/></pattern>
        <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#545b64"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#ff9900"/></marker>
      </defs>
      <rect width="840" height="356" fill="#faf9f6"/>
      <rect width="840" height="356" fill="url(#dots)"/>
      <rect x="0" y="36" width="840" height="80" fill="rgba(22,25,31,0.018)"/>
      <rect x="0" y="196" width="840" height="80" fill="rgba(22,25,31,0.018)"/>

      <!-- Header and lane structure -->
      <line x1="0" y1="36" x2="840" y2="36" stroke="rgba(22,25,31,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="840" y2="116" stroke="rgba(22,25,31,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="840" y2="196" stroke="rgba(22,25,31,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="840" y2="276" stroke="rgba(22,25,31,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="276" stroke="rgba(22,25,31,0.12)" stroke-width="0.8"/>

      <g aria-label="Pipeline steps">
        <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(22,25,31,0.12)"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">COLLECT</text>
        <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(22,25,31,0.12)"/><text x="420" y="14" class="step-number">02</text><text x="420" y="29" class="step-label">EXTRACT</text>
        <rect x="634" y="6" width="32" height="16" rx="8" fill="rgba(255,153,0,0.20)"/><text x="650" y="14" class="step-number focal-text">03</text><text x="650" y="29" class="step-label focal-text">TICKER + QUALITY</text>
        <rect x="784" y="6" width="32" height="16" rx="8" fill="rgba(22,25,31,0.12)"/><text x="800" y="14" class="step-number">04</text><text x="800" y="29" class="step-label">SILVER WRITE</text>
      </g>

      <g aria-label="Chamber / role lanes">
        <text x="70" y="72" class="lane-label">HOUSE</text>
        <text x="70" y="152" class="lane-label">SENATE</text>
        <text x="70" y="232" class="lane-label">SHARED</text><text x="70" y="244" class="lane-label">PIPELINE</text>
      </g>

      <!-- Connectors first. Cross-lane paths use r=8 orthogonal elbows. -->
      <path d="M246 76 H370" fill="none" stroke="#545b64" marker-end="url(#arr-muted)"/>
      <path d="M246 156 H370" fill="none" stroke="#545b64" marker-end="url(#arr-muted)"/>

      <!-- House extract -> shared ticker/quality (focal, cross-lane) -->
      <path d="M470 76 H622 Q630 76 630 84 V204" fill="none" stroke="#ff9900" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <rect x="512" y="56" width="76" height="12" rx="2" fill="#faf9f6"/>
      <text x="550" y="65" fill="#ff9900" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">TRANSACTIONS</text>

      <!-- Senate extract -> shared ticker/quality (muted, cross-lane, hops the focal path) -->
      <path d="M470 156 H622 a8 8 0 0 1 16 0 H662 Q670 156 670 164 V204" fill="none" stroke="#545b64" marker-end="url(#arr-muted)"/>

      <!-- Shared: ticker/quality -> silver write -->
      <path d="M706 236 H768" fill="none" stroke="#545b64" marker-end="url(#arr-muted)"/>

      <!-- House: Collect -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#faf9f6" stroke="rgba(22,25,31,0.25)"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(22,25,31,0.12)"/><text x="159" y="53" class="role-text">HSE</text>
      <text x="196" y="67" class="node-title">House collect</text><text x="196" y="79" class="node-sub">digital + scanned</text><text x="196" y="91" class="node-tool">EventBridge daily</text>
      <rect x="226" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="234" y="104" class="chip-text">DB</text>

      <!-- House: Route & extract -->
      <rect x="370" y="44" width="100" height="64" rx="6" fill="#faf9f6" stroke="rgba(22,25,31,0.25)"/>
      <rect x="374" y="48" width="18" height="10" rx="3" fill="rgba(22,25,31,0.12)"/><text x="383" y="53" class="role-text">HSE</text>
      <text x="420" y="67" class="node-title">Route &amp; extract</text><text x="420" y="79" class="node-sub">digital vs scanned</text><text x="420" y="91" class="node-tool">extract_house_filing</text>
      <rect x="374" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="382" y="104" class="chip-text">DB</text>
      <rect x="450" y="98" width="16" height="8" rx="3" fill="#b8915a"/><text x="458" y="104" class="chip-text">TB</text>

      <!-- Senate: Collect -->
      <rect x="146" y="124" width="100" height="64" rx="6" fill="#faf9f6" stroke="rgba(22,25,31,0.25)"/>
      <rect x="150" y="128" width="18" height="10" rx="3" fill="rgba(22,25,31,0.12)"/><text x="159" y="133" class="role-text">SEN</text>
      <text x="196" y="147" class="node-title">Senate collect</text><text x="196" y="159" class="node-sub">automated + manual</text><text x="196" y="171" class="node-tool">Lambda / human eFD</text>
      <rect x="226" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="234" y="184" class="chip-text">DB</text>

      <!-- Senate: HTML extract -->
      <rect x="370" y="124" width="100" height="64" rx="6" fill="#faf9f6" stroke="rgba(22,25,31,0.25)"/>
      <rect x="374" y="128" width="18" height="10" rx="3" fill="rgba(22,25,31,0.12)"/><text x="383" y="133" class="role-text">SEN</text>
      <text x="420" y="147" class="node-title">HTML extract</text><text x="420" y="159" class="node-sub">no OCR, one parser</text><text x="420" y="171" class="node-tool">extract_senate_filing</text>
      <rect x="374" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="382" y="184" class="chip-text">DB</text>
      <rect x="450" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="458" y="184" class="chip-text">TB</text>

      <!-- Shared: Ticker + LLM fallback + quality gate (focal) -->
      <rect x="594" y="204" width="112" height="64" rx="6" fill="rgba(255,153,0,0.07)" stroke="#ff9900" stroke-width="1.2"/>
      <rect x="598" y="208" width="18" height="10" rx="3" fill="rgba(255,153,0,0.20)"/><text x="607" y="213" class="role-text focal-text">PIPE</text>
      <text x="650" y="227" class="node-title">Ticker + LLM +</text><text x="650" y="237" class="node-title">quality gate</text><text x="650" y="251" class="node-tool">ticker_resolve · llm_fallback</text>
      <rect x="598" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="606" y="264" class="chip-text">TB</text>
      <rect x="682" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="690" y="264" class="chip-text">TB</text>

      <!-- Shared: Silver write -->
      <rect x="768" y="204" width="64" height="64" rx="6" fill="#faf9f6" stroke="rgba(22,25,31,0.25)"/>
      <rect x="772" y="208" width="18" height="10" rx="3" fill="rgba(22,25,31,0.12)"/><text x="781" y="213" class="role-text">PIPE</text>
      <text x="800" y="230" class="node-title" font-size="8">Silver</text><text x="800" y="240" class="node-title" font-size="8">write</text>
      <text x="800" y="252" class="node-tool" font-size="6">part-&lt;doc_id&gt;</text>
      <rect x="772" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="780" y="264" class="chip-text">TB</text>

      <!-- Legend: steps -->
      <text x="164" y="293" class="legend-label">STEPS</text>
      <rect x="180" y="284" width="24" height="12" rx="6" fill="rgba(22,25,31,0.12)"/><text x="192" y="292" class="step-number">01</text><text x="212" y="293" class="legend-text">Collect</text>
      <rect x="280" y="284" width="24" height="12" rx="6" fill="rgba(22,25,31,0.12)"/><text x="292" y="292" class="step-number">02</text><text x="312" y="293" class="legend-text">Extract</text>
      <rect x="380" y="284" width="24" height="12" rx="6" fill="rgba(255,153,0,0.20)"/><text x="392" y="292" class="step-number focal-text">03</text><text x="412" y="293" class="legend-text">Ticker + quality</text>
      <rect x="540" y="284" width="24" height="12" rx="6" fill="rgba(22,25,31,0.12)"/><text x="552" y="292" class="step-number">04</text><text x="572" y="293" class="legend-text">Silver write</text>

      <!-- Legend: data types -->
      <text x="164" y="314" class="legend-label">DATA TYPE</text>
      <rect x="180" y="306" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="188" y="312" class="chip-text">DB</text><text x="202" y="314" class="legend-text">Bronze file</text>
      <rect x="280" y="306" width="16" height="8" rx="3" fill="#b8915a"/><text x="288" y="312" class="chip-text">TB</text><text x="302" y="314" class="legend-text">Silver row</text>
      <text x="380" y="314" class="legend-text">left chip = input · right chip = output</text>

      <!-- Legend: flow -->
      <text x="164" y="336" class="legend-label">FLOW</text>
      <line x1="180" y1="333" x2="204" y2="333" stroke="#545b64" marker-end="url(#arr-muted)"/><text x="212" y="336" class="legend-text">Standard hand-off</text>
      <line x1="340" y1="333" x2="364" y2="333" stroke="#ff9900" stroke-width="1.2" marker-end="url(#arr-accent)"/><text x="372" y="336" class="legend-text">Focal hand-off (transaction rows)</text>
    </svg>
  </main>
</body>
</html>
