<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capitol Lake · Estimated AWS cost by stage</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      background: #faf9f6;
      display: flex;
      justify-content: center;
      padding: 24px;
    }
  </style>
</head>
<body>
  <svg width="760" height="340" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="cost-title cost-desc">
    <title id="cost-title">Estimated AWS cost by pipeline stage</title>
    <desc id="cost-desc">Horizontal bar chart of gross, on-demand AWS cost per year by stage, before Lambda/SQS free-tier discounts: Senate collect automated $0.74, S3 storage $0.29, Extract $0.09, House collect $0.05.</desc>

    <rect width="760" height="340" fill="#faf9f6"/>

    <text x="24" y="34" fill="#16191f" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Estimated AWS cost by stage</text>
    <text x="24" y="52" fill="#545b64" font-size="10.5" font-family="'Geist Mono', monospace">GROSS ON-DEMAND, $/YEAR — BEFORE LAMBDA/SQS FREE TIER</text>

    <!-- gridlines: axis 0 .. 0.75 mapped to x 220 .. 640 -->
    <g stroke="#545b64" stroke-opacity="0.25" stroke-width="1">
      <line x1="220" y1="84" x2="220" y2="276"/>
      <line x1="360" y1="84" x2="360" y2="276"/>
      <line x1="500" y1="84" x2="500" y2="276"/>
      <line x1="640" y1="84" x2="640" y2="276"/>
    </g>
    <g fill="#545b64" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">
      <text x="220" y="290">$0.00</text>
      <text x="360" y="290">$0.25</text>
      <text x="500" y="290">$0.50</text>
      <text x="640" y="290">$0.75</text>
    </g>

    <!-- bars: plot 0..0.75 -> 0..420px starting at x=220 -->
    <!-- Senate collect (automated): 0.744/yr -->
    <g>
      <text x="212" y="106" fill="#16191f" font-size="11.5" font-weight="500" text-anchor="end" font-family="'Geist', sans-serif">Senate collect (automated)</text>
      <rect x="220" y="94" width="417" height="24" rx="4" fill="#ff9900"/>
      <text x="645" y="110" fill="#16191f" font-size="11.5" font-family="'Geist Mono', monospace">$0.744</text>
    </g>

    <!-- S3 storage (Bronze + Silver): 0.285/yr -->
    <g>
      <text x="212" y="154" fill="#16191f" font-size="11.5" font-weight="500" text-anchor="end" font-family="'Geist', sans-serif">S3 storage (Bronze + Silver)</text>
      <rect x="220" y="142" width="160" height="24" rx="4" fill="#ff9900"/>
      <text x="388" y="158" fill="#16191f" font-size="11.5" font-family="'Geist Mono', monospace">$0.285</text>
    </g>

    <!-- Extract (ticker + LLM fallback + silver write): 0.095/yr -->
    <g>
      <text x="212" y="202" fill="#16191f" font-size="11.5" font-weight="500" text-anchor="end" font-family="'Geist', sans-serif">Extract (ticker + LLM fallback)</text>
      <rect x="220" y="190" width="53" height="24" rx="4" fill="#ff9900"/>
      <text x="281" y="206" fill="#16191f" font-size="11.5" font-family="'Geist Mono', monospace">$0.095</text>
    </g>

    <!-- House collect: 0.047/yr -->
    <g>
      <text x="212" y="250" fill="#16191f" font-size="11.5" font-weight="500" text-anchor="end" font-family="'Geist', sans-serif">House collect</text>
      <rect x="220" y="238" width="26" height="24" rx="4" fill="#ff9900"/>
      <text x="254" y="254" fill="#16191f" font-size="11.5" font-family="'Geist Mono', monospace">$0.047</text>
    </g>

    <line x1="220" y1="276" x2="640" y2="276" stroke="#16191f" stroke-width="1"/>

    <text x="24" y="316" fill="#545b64" font-size="10" font-family="'Geist Mono', monospace">NET COST AT THIS VOLUME (WITH AWS'S PERPETUAL LAMBDA/SQS FREE TIER): $0.24/YEAR — ALMOST ENTIRELY S3 STORAGE</text>
    <text x="24" y="330" fill="#545b64" font-size="10" font-family="'Geist Mono', monospace">SEE docs/cost.md FOR ASSUMPTIONS AND THE AWS PRICING CALCULATOR ESTIMATE</text>
  </svg>
</body>
</html>
