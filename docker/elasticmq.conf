// Local SQS emulation for the collect -> extract handoff (#43).
// Pre-creates the queue collect handlers enqueue to and extract consumes
// from, so no separate init container is needed (unlike MinIO's bucket
// creation, ElasticMQ's own config format supports this directly).
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  extract-queue {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }
}
