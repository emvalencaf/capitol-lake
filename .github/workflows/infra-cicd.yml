name: Infra CI/CD

# Terraform plan/apply for infra/ (ADR-0009, #46): OIDC federation for AWS
# auth (no long-lived access keys), apply gated behind a protected GitHub
# Environment with a required reviewer.

on:
  pull_request:
    branches: [development, master]
    paths:
      - "infra/**"
  push:
    branches: [master]
    paths:
      - "infra/**"

permissions:
  id-token: write # required to request the OIDC token
  contents: read

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: us-east-1

jobs:
  plan:
    name: Terraform plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: terraform plan
        run: |
          terraform plan -input=false -lock-timeout=5m \
            -var="finops_alert_email=${{ secrets.FINOPS_ALERT_EMAIL }}"

  apply:
    name: Terraform apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Required-reviewer approval gate: protection rules on this GitHub
    # Environment (repo Settings > Environments) are what actually block the
    # job, not anything in this workflow file — configured by hand, same as
    # the Billing Console cost-allocation tag step in infra/README.md.
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: terraform apply
        run: |
          terraform apply -input=false -auto-approve -lock-timeout=5m \
            -var="finops_alert_email=${{ secrets.FINOPS_ALERT_EMAIL }}"
