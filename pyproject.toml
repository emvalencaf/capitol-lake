[project]
name = "capitol-lake"
description = "Data engineering pipeline."
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "lxml>=5.3.0",
    "numpy>=2.4.6",
    "pyarrow>=25.0.1",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/shared",
    "src/house_collect",
    "src/senate_collect",
    "src/senate_collect_automated",
    "src/extract_data",
    "src/stub",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# vendored third-party skills are not ours to lint
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
